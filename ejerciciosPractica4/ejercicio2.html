<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjeta de usuario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <div class="card">

      <div class="card-banner"></div>

      <div class="card-body">
        <img class="card-avatar"
          src="imagenesInstagram/foto.jpeg" alt="Avatar">

        <div class="card-info">
          <h2 class="card-name">Juana Pérez</h2>
          <p class="card-city">
            Buenos Aires, Argentina
          </p>

          <div class="card-stats">
            <div class="stat">
              <span class="stat-num">320</span>
              <span class="stat-label">Seguidores</span>
            </div>
            <div class="stat">
              <span class="stat-num">1.4k</span>
              <span class="stat-label">Likes</span>
            </div>
            <div class="stat">
              <span class="stat-num">58</span>
              <span class="stat-label">Fotos</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
