<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">
  <title>Perfil Instagram</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="perfil">

    <div class="ig-header">
      <img class="ig-avatar"
        src="imagenesInstagram/foto.jpeg" alt="Avatar">
      <div class="ig-info">
        <p class="ig-username">juanaaa.perez</p>
        <p class="ig-bio">
          Buenos Aires · Fotógrafa
        </p>
        <button class="ig-btn">Seguir</button>
      </div>
    </div>

    <div class="ig-stats">
      <div class="ig-stat">
        <span class="ig-stat-num">58</span>
        <span class="ig-stat-label">
          publicaciones
        </span>
      </div>
      <div class="ig-stat">
        <span class="ig-stat-num">320</span>
        <span class="ig-stat-label">
          seguidores
        </span>
      </div>
      <div class="ig-stat">
        <span class="ig-stat-num">180</span>
        <span class="ig-stat-label">
          seguidos
        </span>
      </div>
    </div>

    <div class="ig-grid">
      <img src="imagenesInstagram/foto1.jpg" alt="">
      <img src="imagenesInstagram/foto2.jpg" alt="">
      <img src="imagenesInstagram/foto3.jpg" alt="">
      <img src="imagenesInstagram/foto4.jpg" alt="">
      <img src="imagenesInstagram/foto5.jpg" alt="">
      <img src="imagenesInstagram/foto6.jpg" alt="">
      <img src="imagenesInstagram/foto7.jpg" alt="">
      <img src="imagenesInstagram/foto8.jpeg" alt="">
      <img src="imagenesInstagram/foto9.jpg" alt="">
    </div>

  </div>
</body>
</html>
