<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-wrap">
    <h2>Iniciar sesión</h2>

    <div class="form-group">
      <label>Email</label>
      <input type="email"
        placeholder="usuario@email.com">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password"
        placeholder="••••••••">
    </div>

    <button class="btn-submit">Ingresar</button>

    <p class="link-row">
      ¿No tenés cuenta?
      <a href="#">Registrate</a>
    </p>
  </div>
</body>
</html>
