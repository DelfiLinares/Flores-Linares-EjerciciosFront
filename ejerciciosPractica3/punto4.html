<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de contacto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-wrap">
    <h2>Contacto</h2>

    <div class="form-group">
      <label>Nombre (máx. 30 caracteres)</label>
      <input type="text" maxlength="30"
        placeholder="Juan">
    </div>

    <div class="form-group">
      <label>Apellido (máx. 30 caracteres)</label>
      <input type="text" maxlength="30"
        placeholder="Pérez">
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input type="email" required
        placeholder="usuario@email.com">
    </div>

    <div class="form-group">
      <label>Asunto</label>
      <select>
        <option value="">-- Seleccioná --</option>
        <option>Pedir presupuesto</option>
        <option>Solicitar cita previa</option>
        <option>Otros</option>
      </select>
    </div>

    <div class="form-group">
      <label>¿Cómo nos encontraste?</label>
      <div class="check-group">
        <label>
          <input type="checkbox"> Un amigo
        </label>
        <label>
          <input type="checkbox"> Googleando
        </label>
        <label>
          <input type="checkbox"> Redes sociales
        </label>
        <label>
          <input type="checkbox"> Otros
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Mensaje (máx. 300 caracteres)</label>
      <textarea rows="4" maxlength="300"
        placeholder="Escribí tu mensaje acá...">
      </textarea>
    </div>

    <div class="form-group">
      <label class="terms-label">
        <input type="checkbox" required>
        Acepto los
        <a href="#">términos y condiciones</a>
      </label>
    </div>

    <button class="btn-submit">Enviar</button>
  </div>
</body>
</html>
