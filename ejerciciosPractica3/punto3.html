<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-wrap">
    <h2>Crear cuenta</h2>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" placeholder="Juan">
    </div>

    <div class="form-group">
      <label>Apellido</label>
      <input type="text" placeholder="Pérez">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email"
        placeholder="usuario@email.com">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password"
        placeholder="••••••••">
    </div>

    <div class="form-group">
      <label>Repetir contraseña</label>
      <input type="password"
        placeholder="••••••••">
    </div>

    <button class="btn-submit">
      Registrarse
    </button>

    <p class="link-row">
      ¿Ya tenés cuenta?
      <a href="#">Iniciá sesión</a>
    </p>
  </div>
</body>
</html>
